name: E2E

# Separate from Build on purpose: Build gates every push and stays fast, while
# this one makes a production build and drives it in a browser. Pull requests
# and main only — running it on every WIP commit is not worth the minutes.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # The sync tests want a real Etesync server; without one they skip
    # themselves, and the case that loses a restore on a synced account would
    # go unchecked. A fresh container per run means a clean account.
    services:
      etesync:
        image: victorrds/etesync:alpine
        ports:
          - 8033:3735
        env:
          SUPER_USER: gymrat
          SUPER_PASS: correct-horse-battery
          # The image's default wildcard makes starlette's TrustedHostMiddleware
          # answer 500 to everything.
          ALLOWED_HOSTS: 127.0.0.1,localhost

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          install_options: --no-daemon
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # The browsers come from the playwright shell, so the whole store is
      # worth keeping between runs. Keyed on the flake, which is what decides
      # what is in it.
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-playwright-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-playwright-${{ runner.os }}-

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install
        run: |
          nix develop --command bash -c "
            pnpm install --frozen-lockfile
          "

      - name: Wait for the Etesync server
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8033/api/v1/authentication/is_etebase/ > /dev/null; then
              echo "server is up"
              exit 0
            fi
            sleep 2
          done
          echo "Etesync server did not come up" >&2
          exit 1

      # Through the playwright shell, the same way the tests are run locally:
      # it brings the browsers with it, pinned alongside the @playwright/test
      # version, so CI and a dev machine drive the identical binary. Installing
      # them here instead (`playwright install`) is what the first two attempts
      # did, and both hung until the step timed out.
      - name: Test
        env:
          E2E_ETEBASE_URL: http://127.0.0.1:8033
        run: |
          nix develop .#playwright --command bash -c "
            pnpm test:e2e
          "

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
